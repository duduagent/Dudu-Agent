name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Typecheck, test, build, UI & provider checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run verify
      # Modul server HARUS dapat dimuat ESM native Node (bukan transformasi vitest) —
      # menangkap kesalahan linking yang tidak terlihat oleh tes (mis. export ganda).
      - name: Impor modul server (ESM native)
        run: npm run check:imports
      # Kerentanan dependensi PRODUKSI (yang benar-benar ikut ke paket).
      # Dev dependency tidak diperiksa di sini: tidak masuk paket dan perbaikannya breaking.
      - name: Audit dependensi produksi
        run: npm run audit:prod
      # Konfigurasi reverse proxy: validasi statis (TLS, loopback, tanpa CORS, batas laju,
      # batas body, timeout, header keamanan). Placeholder domain sengaja TIDAK menghalangi
      # pemeriksaan wajib; mode --strict dipakai terpisah saat domain sudah ditetapkan.
      - name: Validasi konfigurasi reverse proxy
        run: npm run proxy:check
      - name: Probe integrasi waiting list (data sintetis)
        run: npm run probe:waiting-list
      # Uji jalur error provider TANPA kredensial: skenario live menjadi UNVERIFIED (bukan PASSED)
      # dan tidak membuat pipeline gagal. Tidak ada secret yang dipakai di sini.
      - name: Uji kesiapan provider (tanpa kredensial)
        run: npm run smoke:provider
      - name: Audit UI (responsif + kontras ter-render)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a npm run verify:ui

  linux:
    name: Linux (AppImage + deb)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run dist:linux
      - name: Smoke test aplikasi desktop (sandbox Chromium tetap aktif)
        run: |
          # Runner Ubuntu 24.04 membatasi user namespace tanpa profil AppArmor; sandbox Chromium memerlukannya.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get install -y xvfb
          xvfb-run -a node scripts/smoke-desktop.mjs release/linux-unpacked/dudu-ai
      - name: Verifikasi isi paket (ASAR: berkas wajib, tanpa kebocoran, fitur rilis)
        run: npm run verify:release
      - name: Izin eksekusi artefak portabel Linux
        run: |
          # Tarball portabel harus membawa mode 0755 agar ./dudu-ai langsung bisa dijalankan.
          VERSION=$(node -p "require('./package.json').version")
          node scripts/tar-portable.mjs release/linux-unpacked "release/Dudu-AI-${VERSION}-linux-x64-portable.tar.gz"
          tar -tvf "release/Dudu-AI-${VERSION}-linux-x64-portable.tar.gz" | grep -E "dudu-ai$"
      - name: Paket ZIP + checksum
        run: node scripts/package-release.mjs linux
      - uses: actions/upload-artifact@v4
        with:
          name: dudu-ai-linux
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/Dudu-AI-*-Linux-x64.zip
            release/SHA256SUMS-*.txt

  windows:
    name: Windows (NSIS installer + portable)
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      # Tanpa CSC_LINK/CSC_KEY_PASSWORD hasilnya TIDAK ditandatangani (lihat PACKAGING.md).
      - run: npm run dist:win
      - name: Smoke test aplikasi desktop
        run: node scripts/smoke-desktop.mjs "release/win-unpacked/Dudu AI.exe"
      - name: Verifikasi isi paket (ASAR: berkas wajib, tanpa kebocoran, fitur rilis)
        run: npm run verify:release
      - name: Audit UI (responsif + kontras ter-render)
        run: npm run verify:ui
      - name: Paket ZIP + checksum
        run: node scripts/package-release.mjs windows
      - uses: actions/upload-artifact@v4
        with:
          name: dudu-ai-windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/Dudu-AI-*-Windows-x64.zip
            release/SHA256SUMS-*.txt

  macos:
    name: macOS (DMG installer + ZIP portable, x64 + arm64)
    needs: test
    runs-on: macos-14
    env:
      # Tanpa sertifikat: artefak TIDAK ditandatangani dan TIDAK dinotarize (lihat PACKAGING.md).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run dist:mac
      - name: "Verifikasi isi paket (ASAR: berkas wajib, tanpa kebocoran, fitur rilis)"
        run: npm run verify:release
      - name: "Smoke test aplikasi desktop (opsional: runner macOS berbasis GUI)"
        continue-on-error: true
        run: node scripts/smoke-desktop.mjs "release/mac/Dudu AI.app/Contents/MacOS/Dudu AI"
      - name: "Audit UI (opsional di runner macOS)"
        continue-on-error: true
        run: npm run verify:ui
      - name: Paket ZIP + checksum
        run: node scripts/package-release.mjs macos
      - uses: actions/upload-artifact@v4
        with:
          name: dudu-ai-macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/Dudu-AI-Portable-*.zip
            release/Dudu-AI-*-macOS-x64.zip
            release/SHA256SUMS-*.txt

  release:
    name: Publish GitHub Release (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
