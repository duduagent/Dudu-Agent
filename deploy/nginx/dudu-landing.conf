# =====================================================================
# Dudu AI — reverse proxy untuk landing page + endpoint daftar tunggu
# ---------------------------------------------------------------------
# STATUS: konfigurasi INI BELUM DIJALANKAN di lingkungan mana pun.
#        Lihat deploy/README.md → "Prosedur pengujian yang WAJIB dijalankan
#        sebelum produksi" (nginx tidak tersedia di mesin pengembangan ini).
#
# Prinsip yang ditegakkan file ini:
#  1. TLS berakhir di proxy; API Dudu hanya dipanggil lewat loopback (127.0.0.1).
#  2. HANYA SATU endpoint API yang diekspos: POST /api/waiting-list.
#     API Dudu tidak punya autentikasi (mode lokal) → /api/* lain WAJIB 404.
#  3. Pembatasan per-IP memakai alamat klien yang benar (remote_addr),
#     bukan X-Forwarded-For dari klien (tidak dipercaya).
#  4. Body dibatasi kecil; timeout singkat; backend mati → halaman sendiri.
#  5. Tanpa CORS (arsitektur same-origin): tidak ada Access-Control-Allow-Origin.
#  6. Header keamanan untuk landing page (statis).
#
# Ganti placeholder <...> sebelum dipakai:
#   - <DOMAIN>            domain resmi
#   - <PATH_SERT> <PATH_KEY>  sertifikat TLS
#   - <PATH_LANDING>      folder berisi landing/
#   - <PATH_DUDU_DATA>    folder data Dudu (harus milik akun pengguna yang menjalankan API, bukan milik web server)
# =====================================================================

# ---- Batas laju: per-IP (alamat klien asli), TANPA mempercayai header klien ----
limit_req_zone $binary_remote_addr zone=dudu_waitinglist:10m rate=10r/m;

# ---- Halaman statis landing page ----
server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;

    # Semua HTTP → HTTPS (tanpa-Fi tidak ada data yang bisa bocor).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <DOMAIN>;

    # ---------- TLS ----------
    ssl_certificate     <PATH_SERT>;
    ssl_certificate_key <PATH_KEY>;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---------- Batas request ----------
    client_max_body_size 16k;          # waiting list hanya butuh <1 KB
    client_body_timeout 10s;
    client_header_timeout 10s;

    # ---------- Header keamanan untuk landing page ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # API tidak punya autentikasi → izinkan HANYA endpoint daftar tunggu.
    location = /api/waiting-list {
        limit_req zone=dudu_waitinglist burst=5 nodelay;   # per-IP, alamat klien asli
        limit_except POST { deny all; }                    # hanya POST

        proxy_pass http://127.0.0.1:8787;                 # loopback saja
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Dudu-Client 1;                 # header anti-CSRF yang diwajibkan API
        proxy_set_header X-Real-IP $remote_addr;          # untuk log; JANGAN dipakai sebagai identitas klien
        # JANGAN set X-Forwarded-For dari klien: header itu tidak dipercaya.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_buffering off;

        # Backend mati/timeout → halaman sendiri, bukan error proxy mentah.
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_unavailable;
    }

    # Endpoint API lain: TIDAK diekspos (API Dudu tidak punya autentikasi).
    location /api/ {
        return 404;
    }

    # ---------- Landing page (statis) ----------
    root <PATH_LANDING>;
    index index.html;

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }

    # Halaman status saat backend tidak tersedia.
    location @backend_unavailable {
        default_type text/html;
        add_header Retry-After 60 always;
        return 503 "<!doctype html><meta charset=utf-8><title>Dudu</title><h1>While we are down</h1><p>The waiting list is temporarily unavailable. Please try again in a minute.</p>";
    }
}
